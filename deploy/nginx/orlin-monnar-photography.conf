# /etc/nginx/sites-available/orlin-monnar-photography.conf
# Un solo origen: landing (/), panel (/admin), API (/api) y derivados de galería (/media).
# Dominio canónico: www.orlinmonnarphotography.com (el dominio sin www redirige aquí).

upstream omp_api {
    server 127.0.0.1:5000;          # ASPNETCORE_URLS del servicio omp-api
    keepalive 16;
}

# Cualquier Host que no sea el dominio se descarta (AllowedHosts de la API está en "*").
# http2 también aquí: en nginx 1.24 todas las directivas listen de un mismo puerto deben
# declarar las mismas opciones de protocolo o se emite "protocol options redefined".
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    return 444;
}

# HTTP → HTTPS (deja pasar el reto de certbot)
server {
    listen 80;
    listen [::]:80;
    server_name orlinmonnarphotography.com www.orlinmonnarphotography.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.orlinmonnarphotography.com$request_uri;
    }
}

# Dominio sin www → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orlinmonnarphotography.com;

    ssl_certificate     /etc/letsencrypt/live/www.orlinmonnarphotography.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.orlinmonnarphotography.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.orlinmonnarphotography.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.orlinmonnarphotography.com;

    ssl_certificate     /etc/letsencrypt/live/www.orlinmonnarphotography.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.orlinmonnarphotography.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root  /var/www/omp/landing;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 1 MB basta para cualquier JSON de la API; solo la subida de fotos lo amplía.
    client_max_body_size 1m;

    include snippets/omp-compression.conf;
    include snippets/omp-security-headers.conf;

    # Nunca servir archivos ocultos (.git, .gitignore) si llegaran a copiarse.
    location ~ /\. {
        return 404;
    }

    # -------------------------------------------------------------------------
    # API (Kestrel). ^~ evita que las regex de la landing capturen estas rutas.
    # Sin add_header aquí: la API decide su propio Cache-Control.
    # -------------------------------------------------------------------------
    location ^~ /api/ {
        include snippets/omp-proxy.conf;
        proxy_pass http://omp_api;
    }

    # Subida de fotografías: coincidencia exacta, gana sobre /api/.
    # client_max_body_size DEBE ser igual a Storage:MaxUploadSizeMB: si Nginx deja pasar
    # más que Kestrel, Kestrel corta la conexión y el navegador recibe 502 en lugar de 413.
    # Timeout por encima de los 120 s de DEFAULT_UPLOAD_TIMEOUT_MS del panel (ImageSharp).
    location = /api/admin/gallery/photos {
        client_max_body_size 25m;
        proxy_read_timeout   180s;
        proxy_send_timeout   180s;
        include snippets/omp-proxy.conf;
        proxy_pass http://omp_api;
    }

    # -------------------------------------------------------------------------
    # Derivados WebP: los sirve la API (UseStaticFiles sobre Storage:RootPath) con
    # Cache-Control "public,max-age=31536000,immutable". Nginx no lo sobrescribe.
    # -------------------------------------------------------------------------
    location ^~ /media/ {
        gzip off;                       # WebP ya está comprimido
        include snippets/omp-proxy.conf;
        proxy_pass http://omp_api;
    }

    # -------------------------------------------------------------------------
    # Panel (build de Vite con base "/admin/" y history mode)
    # -------------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    # Assets con hash en el nombre: inmutables. Sin fallback: un .js que falta
    # debe dar 404, no el index.html (eso provoca un error de tipo MIME).
    location ^~ /admin/assets/ {
        root /var/www/omp;
        try_files $uri =404;
        include snippets/omp-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Deep links (/admin/appointments, /admin/gallery/...) caen en index.html.
    location ^~ /admin/ {
        root /var/www/omp;
        try_files $uri $uri/ /admin/index.html;
        include snippets/omp-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # -------------------------------------------------------------------------
    # Landing estática (sin build: CSS/JS sin hash → revalidar siempre con ETag)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
        include snippets/omp-security-headers.conf;
        add_header Cache-Control "no-cache";

        location ~* \.(?:jpe?g|png|webp|gif|svg|ico|woff2?|ttf|eot|otf)$ {
            include snippets/omp-security-headers.conf;
            add_header Cache-Control "public, max-age=604800";
        }
    }
}
