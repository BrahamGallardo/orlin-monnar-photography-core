# /etc/nginx/snippets/omp-proxy.conf
# Encabezados que lee UseForwardedHeaders (Program.cs). Sin X-Forwarded-For, el rate
# limiting por IP mete a todos los visitantes en una sola partición; sin X-Forwarded-Proto,
# UseHttpsRedirection no sabe que la petición original ya llegó por HTTPS.
# $remote_addr (no $proxy_add_x_forwarded_for): Nginx recibe la conexión directa del
# cliente, así que lo que el cliente mande en X-Forwarded-For se sustituye en lugar de concatenarse.
# Los timeouts NO van aquí: repetir el directivo en la misma location es un error de sintaxis.
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Forwarded-For   $remote_addr;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
