# /etc/nginx/snippets/omp-compression.conf
# Se incluye a nivel server (no http) para no duplicar el "gzip on" que trae nginx.conf.
# text/html siempre está incluido; listarlo genera una advertencia.
# image/webp no se incluye a propósito: nunca se comprime.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        text/css text/javascript application/javascript application/json application/problem+json;

# Brotli: solo si el módulo está instalado (apt install libnginx-mod-http-brotli-filter).
# Sin el módulo, estas líneas tumban "nginx -t": déjalas comentadas.
# brotli            on;
# brotli_comp_level 5;
# brotli_min_length 1024;
# brotli_types      text/css text/javascript application/javascript application/json application/problem+json;
